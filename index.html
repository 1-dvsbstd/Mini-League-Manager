<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Baruc's League - FPL Side Pot Tracker</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <!-- Installation will be enabled after league-specific launch is verified. -->
    <meta name="theme-color" content="#070b12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        (() => {
            const previewTheme = new URLSearchParams(window.location.search).get('theme');
            const allowedThemes = ['royal', 'stadium', 'burgundy'];
            if (allowedThemes.includes(previewTheme)) {
                document.documentElement.dataset.theme = previewTheme;
            }
        })();
    </script>

    <style>
        :root {
            --surface-color: #070b12;       /* Stadium-night navy */
            --card-bg: #111a28;             /* Floodlit slate card */
            --card-border: rgba(255, 255, 255, 0.09); /* Subtle glass edge */
            --primary-color: #00ff87;        /* FPL Green - RESERVED FOR KEY STATS */
            --accent-color: #d2b06f;         /* Aged trophy brass */
            --ice-blue: #bdcbd8;             /* Floodlight silver-blue */
            --text-color: #f3ede2;           /* Warm stadium ivory */
            --text-muted: #adb9c8;           /* Slate supporting copy */
            --text-warm: #e1c28b;            /* Trophy-room champagne */
            --text-violet: #91a3b8;          /* Steel-blue tertiary labels */
            --border-subtle: rgba(255, 255, 255, 0.06);
            --danger-color: #ff4b4b;        /* Crisp red for hits & low ranks */
            --gold-color: #ffc72c;          /* Refined gold for winners & 1st place */
            --silver-color: #d1d5db;        /* Metallic silver for runner-up prizes */
            --rank-gold-edge: rgba(255, 199, 44, 0.78);
            --rank-silver-edge: rgba(226, 232, 240, 0.72);
        }

        /* Optional palette previews. Rank and prize colours stay unchanged. */
        :root[data-theme="royal"] {
            --surface-color: #09070d;
            --card-bg: #1b1120;
            --accent-color: #b98a43;
            --ice-blue: #bbb5b0;
            --text-color: #f0e7d9;
            --text-muted: #aaa3aa;
            --text-warm: #d5b274;
            --text-violet: #918893;
        }

        :root[data-theme="stadium"] {
            --surface-color: #070b12;
            --card-bg: #111a28;
            --accent-color: #d2b06f;
            --ice-blue: #bdcbd8;
            --text-color: #f3ede2;
            --text-muted: #adb9c8;
            --text-warm: #e1c28b;
            --text-violet: #91a3b8;
        }

        :root[data-theme="burgundy"] {
            --surface-color: #12080d;
            --card-bg: #2a101c;
            --accent-color: #d4a06f;
            --ice-blue: #d8c5cd;
            --text-color: #f5e9df;
            --text-muted: #cbb3bd;
            --text-warm: #e6c092;
            --text-violet: #bd879d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--surface-color);
            background-image:
                linear-gradient(180deg, rgba(7, 4, 18, 0.12) 0%, rgba(14, 3, 24, 0.22) 52%, rgba(7, 4, 18, 0.38) 100%),
                url('page-bg.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 24px 14px;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 4px 0;
            text-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }

        .update-timestamp {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .data-status-notice {
            display: none;
            margin: 0 auto 14px;
            padding: 8px 11px;
            border: 1px solid rgba(210, 176, 111, 0.42);
            border-radius: 8px;
            background: rgba(35, 27, 13, 0.82);
            color: var(--text-warm);
            font-size: 0.68rem;
            font-weight: 700;
            line-height: 1.35;
            text-align: center;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 5px 16px rgba(0,0,0,0.18);
        }

        .data-status-notice.visible { display: block; }

        /* Splash Screen Styling */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--surface-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease-out;
        }

        #splash-screen img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (min-width: 700px) {
            #splash-screen {
                overflow: hidden;
                background: #070510;
            }

            #splash-screen::before {
                content: '';
                position: absolute;
                inset: -22px;
                background:
                    linear-gradient(rgba(5,3,12,0.55), rgba(5,3,12,0.7)),
                    url('splash-bg.png') center center / cover no-repeat;
                filter: blur(14px);
                transform: scale(1.04);
            }

            #splash-screen img {
                width: auto;
                max-width: 100%;
                object-fit: contain;
                box-shadow: 0 0 55px rgba(0,0,0,0.7);
            }
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* App Container */
        #app {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Glassmorphic Cards */
        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.15) 100%), var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px 14px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }

        /* Section Headings */
        .section-title {
            color: var(--text-color);
            text-align: center;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 0 0 14px 0;
            opacity: 0.9;
        }

        /* GW Cards & Dropdowns */
        .fut-card {
            position: relative;
            cursor: pointer;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.15) 100%), var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            user-select: none;
        }
        
        .fut-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .fut-card.glow-gold {
            border: 1.5px solid var(--gold-color) !important;
            box-shadow: 0 0 16px rgba(255, 199, 44, 0.25), inset 0 0 12px rgba(255, 199, 44, 0.1);
        }

        .chip-badge {
            font-size: 0.62rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 4px;
            margin-left: 8px;
            text-transform: uppercase;
            background: var(--gold-color);
            color: #12041f;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .card-dropdown {
            margin-top: 12px;
            border-top: 1px solid var(--border-subtle);
            padding-top: 10px;
            font-size: 0.85rem;
            display: none;
        }

        .fut-card.expanded .card-dropdown {
            display: block;
        }

        /* Standings Chip Inventory Pills */
        .chip-inventory {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
            width: 100%;
        }
        
        .chip-pill {
            font-size: 0.58rem;
            font-weight: 700;
            padding: 3px 0;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            text-align: center;
            box-sizing: border-box;
            flex: 1;
            min-width: 0;
            line-height: 1.1;
        }
        
        .chip-pill.active {
            color: var(--gold-color);
            border-color: var(--gold-color);
            background: rgba(7, 22, 55, 0.58);
            box-shadow: 0 0 9px rgba(255, 199, 44, 0.30), inset 0 0 8px rgba(255, 199, 44, 0.10), inset 0 1px 0 rgba(255,255,255,0.12);
            text-shadow: 0 0 7px rgba(255, 199, 44, 0.36);
            opacity: 1;
        }

        .chip-pill.available {
            color: rgba(189, 203, 216, 0.64);
            border-color: rgba(189, 203, 216, 0.14);
            background: rgba(5, 9, 16, 0.32);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.38);
            opacity: 0.72;
        }
        
        .chip-pill.used {
            color: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.03);
            background: transparent;
            text-decoration: line-through;
            opacity: 0.5;
        }

        /* Carousel Component Styling */
        .carousel-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 16px;
            padding-bottom: 8px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-card {
            min-width: 100%;
            box-sizing: border-box;
            scroll-snap-align: start;
        }

        /* GW Carousel Header Controls */
        .gw-carousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 2px;
        }
        .carousel-nav-btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .carousel-nav-btn:hover:not(:disabled) {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }
        .carousel-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        /* Badges */
        .badge-live {
            background: rgba(0, 255, 135, 0.13);
            color: var(--primary-color);
            border: 1px solid rgba(0, 255, 135, 0.38);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .badge-live::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        .badge-final {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .badge-deadline {
            background: rgba(197, 164, 210, 0.10);
            color: var(--ice-blue);
            border: 1px solid rgba(197, 164, 210, 0.28);
            padding: 3px 7px;
            border-radius: 6px;
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.35px;
            white-space: nowrap;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .dot.active {
            width: 18px;
            border-radius: 4px;
            background-color: var(--primary-color);
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-weight: 500;
        }

        /* FUT-inspired Gameweek Experience */
        .gw-carousel-header {
            position: relative;
            top: auto;
            z-index: 1;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            background: rgba(14, 3, 24, 0.92);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(14px);
        }

        .gw-title-stack {
            min-width: 110px;
            text-align: center;
        }

        .gw-title {
            color: #fff;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .gw-status {
            min-height: 22px;
            margin-top: 4px;
            display: flex;
            justify-content: center;
        }

        .gw-progress {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            min-height: 12px;
            margin: -4px 0 12px;
        }

        .gw-progress-dot {
            width: 6px;
            height: 6px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.38);
            cursor: pointer;
            transition: width 0.2s ease, background 0.2s ease, opacity 0.2s ease;
        }

        .gw-progress-dot.active {
            width: 20px;
            border-radius: 5px;
            background: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.3);
        }

        .gw-progress-dot.is-hidden {
            display: none;
        }

        .manager-item {
            --item-accent: rgba(255, 255, 255, 0.13);
            position: relative;
            overflow: visible;
            z-index: 1;
            border: 2px solid var(--item-accent) !important;
            padding: 12px 14px;
            margin-bottom: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            outline: none;
            background-color: #160b1f;
            background:
                linear-gradient(115deg, rgba(255,255,255,0.035), transparent 30%),
                linear-gradient(145deg, #22122d, #160b1f);
        }

        .manager-item:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 3px;
        }

        .manager-glow-wrap {
            position: relative;
            isolation: isolate;
            margin-bottom: 8px;
        }

        .manager-item * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .manager-item::selection,
        .manager-item *::selection {
            background: transparent;
        }

        .manager-item::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            opacity: 0.2;
            background-image:
                linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.16) 49%, transparent 57%),
                repeating-linear-gradient(135deg, transparent 0 18px, rgba(255,255,255,0.035) 18px 19px);
        }

        .manager-item.rank-card-1 {
            --item-accent: var(--rank-gold-edge);
            background: linear-gradient(145deg, #22122d, #160b1f);
            box-shadow: 0 0 0 1px rgba(255, 199, 44, 0.08), 0 0 26px rgba(255, 199, 44, 0.14), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .manager-item.rank-card-2 {
            --item-accent: var(--rank-silver-edge);
            background: linear-gradient(145deg, #22122d, #160b1f);
            box-shadow: 0 0 0 1px rgba(226, 232, 240, 0.12), 0 0 24px rgba(226, 232, 240, 0.13), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .manager-item.rank-card-3 {
            --item-accent: rgba(178, 103, 57, 0.58);
            background: linear-gradient(145deg, #22122d, #160b1f);
            box-shadow: 0 0 0 1px rgba(178, 103, 57, 0.08), 0 0 22px rgba(178, 103, 57, 0.1), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .manager-item.rank-card-4 {
            --item-accent: rgba(169, 61, 85, 0.34);
            background: linear-gradient(145deg, #22122d, #160b1f);
            box-shadow: 0 0 0 1px rgba(169, 61, 85, 0.07), 0 0 22px rgba(169, 61, 85, 0.1), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .manager-item.rank-card-1 .manager-score-value { color: var(--gold-color); }
        .manager-item.rank-card-2 .manager-score-value { color: var(--silver-color); }
        .manager-item.rank-card-3 .manager-score-value { color: #a86f46; }
        .manager-item.rank-card-4 .manager-score-value { color: #9a5968; }

        .manager-glow-wrap.transfer-positive::before,
        .manager-glow-wrap.transfer-negative::before {
            content: '';
            display: block;
            position: absolute;
            top: 20%;
            right: -13px;
            bottom: 20%;
            left: -13px;
            z-index: 0;
            pointer-events: none;
            border-radius: 40%;
            filter: blur(9px);
        }

        .manager-glow-wrap.transfer-positive::before {
            border: 0;
            background: linear-gradient(90deg, rgba(0,255,126,0.88) 0, rgba(0,255,126,0.34) 7%, transparent 18%, transparent 82%, rgba(0,255,126,0.34) 93%, rgba(0,255,126,0.88) 100%);
            box-shadow: none;
        }

        .manager-glow-wrap.transfer-negative::before {
            border: 0;
            background: linear-gradient(90deg, rgba(255,28,58,0.9) 0, rgba(255,28,58,0.36) 7%, transparent 18%, transparent 82%, rgba(255,28,58,0.36) 93%, rgba(255,28,58,0.9) 100%);
            box-shadow: none;
        }

        .manager-item.glow-gold {
            border-color: var(--rank-gold-edge) !important;
            background:
                radial-gradient(circle at 50% -30%, rgba(255,199,44,0.42) 0%, rgba(255,199,44,0.13) 24%, transparent 46%),
                linear-gradient(115deg, transparent 0 13%, rgba(255,199,44,0.10) 13.5% 14.5%, transparent 15% 84%, rgba(255,199,44,0.10) 84.5% 85.5%, transparent 86%),
                linear-gradient(145deg, #071637, #0b3274 52%, #07132f);
            box-shadow: 0 0 34px rgba(36, 112, 219, 0.36), 0 0 20px rgba(255, 199, 44, 0.22), inset 0 0 30px rgba(32, 104, 202, 0.22), inset 0 1px 0 rgba(255,238,178,0.30);
        }

        .manager-item.glow-gold::before {
            opacity: 1;
            background:
                conic-gradient(from 45deg at 50% 48%, transparent 0 10%, rgba(255,215,90,0.055) 10% 12%, transparent 12% 23%, rgba(255,255,255,0.035) 23% 25%, transparent 25% 100%),
                radial-gradient(circle at 50% 50%, rgba(104,174,255,0.12), transparent 45%);
        }

        .manager-item.glow-gold::after {
            content: '';
            position: absolute;
            inset: 5px;
            z-index: 0;
            border: 1px solid rgba(255, 199, 44, 0.30);
            border-radius: 9px;
            background: linear-gradient(120deg, rgba(255,199,44,0.06), transparent 32%, rgba(255,199,44,0.025) 62%, transparent);
            pointer-events: none;
        }

        .manager-item.glow-gold > * { position: relative; z-index: 1; }

        .manager-summary {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
        }

        .manager-rank {
            width: 38px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid color-mix(in srgb, var(--item-accent) 72%, transparent);
            background: rgba(0, 0, 0, 0.24);
            clip-path: polygon(18% 0, 100% 0, 100% 82%, 82% 100%, 0 100%, 0 18%);
            color: var(--item-accent);
            font-size: 1.3rem;
            font-weight: 900;
        }

        .manager-name {
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
        }

        .manager-name-line {
            display: flex;
            align-items: baseline;
            gap: 8px;
            min-width: 0;
        }

        .manager-name-line .compact-overall {
            margin: 0;
            font-size: 0.72rem;
            white-space: nowrap;
        }

        .manager-team {
            color: var(--text-muted);
            font-size: 0.72rem;
            margin-top: 2px;
        }

        .manager-overall {
            color: var(--text-muted);
            font-size: 0.66rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .rank-up { color: var(--primary-color); }
        .rank-down { color: var(--danger-color); }
        .rank-level { color: var(--text-muted); }

        .standing-points-wrap {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            white-space: nowrap;
        }

        .standing-movement {
            min-width: 0;
            font-size: 0.68rem;
            font-weight: 850;
            line-height: 1;
            text-align: left;
        }

        .manager-score {
            text-align: right;
        }

        .compact-overall {
            margin-top: 7px;
            color: #fff;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.03em;
        }

        .score-metrics {
            display: flex;

<body>

    <!-- Splash Screen Overlay -->
    <div id="splash-screen">
        <img src="splash-bg.png" alt="Loading" onerror="this.parentElement.style.display='none'">
    </div>

    <h1 id="league-heading">Your league</h1>
    <div class="update-timestamp">Local transfer preview · original app layout</div>

    <div id="data-status-notice" class="data-status-notice" role="status" aria-live="polite"></div>

    <div id="app">
        <div class="loading-text">Loading tracker data...</div>
    </div>
    <div id="livePlayerOverlay" class="player-sheet-overlay" onclick="closeLivePlayerBreakdown(event)">
        <div id="livePlayerOverlayBody" class="player-sheet" onclick="event.stopPropagation()"></div>
    </div>

    <div id="timestamp" class="update-timestamp" style="margin-top: 20px; margin-bottom: 0;"></div>

    <script src="adapter.js"></script>
    <script src="squad.js"></script>
    <script>
        function renderSharedPrizes(competition) {
          const money=value=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2}).format(value);
          const count=(competition.complete?(competition.awards||[]):(competition.payouts||[])).length;
          const wrapStart='<div class="period-prize-grid count-'+count+'">', wrapEnd='</div>';
          if(competition.complete) return wrapStart+((competition.awards||[]).map((a,index)=>'<div class="period-prize '+(index===0?'winner':index===1?'runner':'third')+'"><strong>'+(['Winner','Runner-up','Third place'][index]||'Place '+(index+1))+'</strong>'+escapeProfileHtml(a.managerName)+' <span>– '+money(a.prize)+'</span></div>').join('') || '<div class="period-prize"><strong>Final</strong>No awards recorded.</div>')+wrapEnd;
          return wrapStart+(competition.payouts||[]).map((amount,index)=>'<div class="period-prize '+(index===0?'winner':index===1?'runner':'third')+'"><strong>'+(['Winner','Runner-up','Third place'][index]||'Place '+(index+1))+'</strong>To be confirmed <span>– '+money(amount)+'</span></div>').join('')+wrapEnd;
        }
        const query = new URLSearchParams(location.search);
        const leagueKey = (query.get('league') || '').trim().toLowerCase();
        const sourceName = query.get('source') || 'production';
        const SOURCES = {
          production: 'https://script.google.com/macros/s/AKfycbweMrJ-TOSKRoI18nw9z-aka290wIfQke9U733B1LE_aI3Lk73Bpox3wKQNqQ2lcYJ3/exec',
          test: 'https://script.google.com/macros/s/AKfycbxZfXcEJppKQHoIlFWIff_0wV99BPheyyvs4qgNsm5JBTIMoWCvuz21OTcZzSVo0JS6/exec'
        };
        const STORAGE_SCOPE = 'league-transfer-v1:' + sourceName + ':' + leagueKey + ':';
        let hasRenderedTrackerData = false, loadSerial = 0, loadController = null;
        let squadContext = null;
        function notice(message) {
          const element = document.getElementById('data-status-notice');
          element.textContent = message;
          element.classList.toggle('visible', Boolean(message));
        }
        let loadedLeagueData=null;
        function downloadLeagueFile(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
        function exportLeagueCsv(){if(!loadedLeagueData)return;const rows=loadedLeagueData.overall?.rows||[],csv=[['Manager','Points','Team','Manager ID'],...rows.map(r=>[r[0],r[1],r[6],r[7]])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');downloadLeagueFile((loadedLeagueData.leagueKey||'league')+'-standings.csv',csv,'text/csv;charset=utf-8');}
        function exportLeagueJson(){if(loadedLeagueData)downloadLeagueFile((loadedLeagueData.leagueKey||'league')+'-data.json',JSON.stringify(loadedLeagueData,null,2),'application/json;charset=utf-8');}
        async function copyLeagueLink(){try{await navigator.clipboard.writeText(window.location.href);notice('League link copied. Share it with your members.');}catch(error){notice('Copy was blocked by the browser. Copy the address from the browser bar.');}}
        let currentGwSlideIdx = 0;
        let totalGwSlides = 0;
        let gwDataStore = [];
        let gwCarouselInitialized = false;
        let gwButtonScrollActive = false;
        let gwButtonScrollTimer = null;
        let gwButtonScrollToken = 0;
        let currentPeriodSlideIdx = 0;
        let totalPeriodSlides = 0;
        let currentProfileSlideIdx = 0;
        let totalProfileSlides = 0;
        let periodCarouselInitialized = false;
        let profileCarouselInitialized = false;
        let periodLoopActive = false;
        let profileLoopActive = false;

        function hideSplash() {
            const splash = document.getElementById('splash-screen');
            if (splash && !splash.classList.contains('fade-out')) {
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 400);
            }
        }

        function getChipDisplayName(chipKey) {
            if (!chipKey) return '';
            const s = String(chipKey).toLowerCase();
            if (s.includes('wildcard') || s === 'wc') return 'WILDCARD';
            if (s.includes('free') || s === 'fh') return 'FREE HIT';
            if (s.includes('bboost') || s.includes('bench') || s === 'bb') return 'BENCH BOOST';
            if (s.includes('3c') || s.includes('3xc') || s.includes('triple') || s === 'tc') return 'TRIPLE CAPTAIN';
            return chipKey.toUpperCase();
        }

        function renderChipsHtml(chipsData, activeChip) {
            const standardChips = [
                { id: 'wc', label: 'WC' },
                { id: 'fh', label: 'FH' },
                { id: 'bb', label: 'BB' },
                { id: 'tc', label: 'TC' }
            ];

            const normalize = (name) => {
                if (!name) return '';
                const s = String(name).toLowerCase();
                if (s.includes('wildcard') || s === 'wc') return 'wc';
                if (s.includes('free') || s === 'fh') return 'fh';
                if (s.includes('bboost') || s.includes('bench') || s === 'bb') return 'bb';
                if (s.includes('3c') || s.includes('3xc') || s.includes('triple') || s === 'tc') return 'tc';
                return s;
            };

            const activeNorm = normalize(activeChip);

            const statusMap = {};
            if (chipsData && typeof chipsData === 'object') {
                Object.keys(chipsData).forEach(k => {
                    const normKey = normalize(k);
                    const val = chipsData[k];
                    if (val === false || val === 'used') statusMap[normKey] = 'used';
                    else if (val === true || val === 'available') statusMap[normKey] = 'available';
                });
            }

            return `<div class="chip-inventory">` + standardChips.map(chip => {
                let state = 'available';

                if (activeNorm === chip.id) {
                    state = 'active';
                } else if (statusMap[chip.id] === 'used') {
                    state = 'used';
                }

                return `<span class="chip-pill ${state}"><span>${chip.label}</span></span>`;
            }).join('') + `</div>`;
        }

        function formatTransfers(rawText, hits) {
            if (!rawText || rawText === 'None') {
                return hits && hits > 0 ? `(-${hits} pts hit)` : 'None';
            }
            const ins = [];
            const outs = [];
            const inMatches = rawText.match(/In:\s*([^,\/]+)/gi);
            const outMatches = rawText.match(/Out:\s*([^,\/]+)/gi);
            
            if (inMatches) {
                inMatches.forEach(m => {
                    const name = m.replace(/In:\s*/i, '').trim();
                    if (name && !ins.includes(name)) ins.push(name);
                });
            }
            if (outMatches) {
                outMatches.forEach(m => {
                    const name = m.replace(/Out:\s*/i, '').trim();
                    if (name && !outs.includes(name)) outs.push(name);
                });
            }
            
            if (ins.length === 0 && outs.length === 0) {
                let res = String(rawText);
                if (hits && hits > 0 && !res.includes('pt')) res += ` (-${hits} pts hit)`;
                return res;
            }
            
            let resultParts = [];
            if (ins.length > 0) resultParts.push(`In: ${ins.join(', ')}`);
            if (outs.length > 0) resultParts.push(`Out: ${outs.join(', ')}`);
            
            let finalStr = resultParts.join(' | ');
            if (hits && hits > 0 && !finalStr.includes('pt')) {
                finalStr += ` (-${hits} pts hit)`;
            }
            return finalStr;
        }

        function getManagerKey(manager) {
            return String(manager.managerId);
        }

        function getManagerPoints(manager) {
            return manager.netPoints === null ? null : Number(manager.netPoints !== undefined ? manager.netPoints : manager.livePoints);
        }

        function rankKeysByScore(keys, scoreMap) {
            const sorted = [...keys].sort((a, b) => {
                const scoreDiff = (scoreMap[b] || 0) - (scoreMap[a] || 0);
                return scoreDiff || a.localeCompare(b);
            });

            const ranks = {};
            let previousScore = null;
            let previousRank = 0;
            sorted.forEach((key, index) => {
                const score = scoreMap[key] || 0;
                const rank = previousScore !== null && score === previousScore ? previousRank : index + 1;
                ranks[key] = rank;
                previousScore = score;
                previousRank = rank;
            });
            return ranks;
        }

        // The shared adapter supplies ranks; a partial history cannot imply form.
        function decorateGameweekData() {}
        async function loadTrackerData() {
          const ticket=++loadSerial;loadController?.abort();loadController=new AbortController();
          const controller=loadController,timeout=setTimeout(()=>controller.abort(),25000);
          try {
            if(!/^[a-z0-9]{8}$/.test(leagueKey)||!SOURCES[sourceName]) throw new Error('Open the shared link supplied by your league organiser.');
            const url=new URL(SOURCES[sourceName]);url.searchParams.set('action','getTrackerData');url.searchParams.set('leagueKey',leagueKey);
            const response=await fetch(url,{signal:controller.signal,cache:'no-store',credentials:'omit'});
            if(!response.ok)throw new Error('League data is temporarily unavailable.');
            const raw=await response.json();if(ticket!==loadSerial)return;
            let historyData,historyWarning='';
            if(raw.capabilities?.history===1){
              try{
                const historyUrl=new URL(SOURCES[sourceName]);historyUrl.searchParams.set('action','getTrackerHistory');historyUrl.searchParams.set('leagueKey',leagueKey);
                const historyResponse=await fetch(historyUrl,{signal:controller.signal,cache:'no-store',credentials:'omit'});
                if(!historyResponse.ok)throw new Error('History unavailable');
                historyData=await historyResponse.json();
                window.LeagueAdapter.adapt(raw,leagueKey,historyData);
              }catch{historyData=undefined;historyWarning=' Full gameweek history could not be loaded.';}
            }
            if(ticket!==loadSerial)return;
            const data=window.LeagueAdapter.adapt(raw,leagueKey,historyData);
            document.getElementById('league-heading').textContent=raw.league.name;
            squadContext={seasonKey:raw.season.key,enabled:raw.capabilities?.squad===1};
            document.title=raw.league.name+' · League app';loadedLeagueData=data;renderApp(data);hasRenderedTrackerData=true;
            document.querySelectorAll('.manager-item.expanded').forEach(loadManagerSquad);
            document.getElementById('timestamp').textContent='Updated: '+new Date(raw.dataUpdatedAt).toLocaleString();notice(data.notice+historyWarning);
          }catch(error){
            if(ticket!==loadSerial)return;
            notice(hasRenderedTrackerData?'Could not refresh. Showing the previously loaded results; check their update time.':error.name==='AbortError'?'The league took too long to respond. Reload to try again.':error.message);
            if(!hasRenderedTrackerData)document.getElementById('app').innerHTML='<div class="card"><p>League data could not be loaded.</p></div>';
          }finally{clearTimeout(timeout);if(ticket===loadSerial)hideSplash();}
        }

        function toggleManagerCard(card) {
            const isExpanded = !card.classList.contains('expanded');
            if (isExpanded) {
                document.querySelectorAll('.manager-item.expanded').forEach(openCard => {
                    if (openCard !== card) {
                        openCard.classList.remove('expanded');
                        openCard.setAttribute('aria-expanded', 'false');
                    }
                });
            }
            card.classList.toggle('expanded', isExpanded);
            card.setAttribute('aria-expanded', String(isExpanded));
            if(isExpanded)loadManagerSquad(card);
            const cardKey = card.dataset.cardKey;
            if (cardKey) {
                try {
                    sessionStorage.setItem(STORAGE_SCOPE + 'expanded', JSON.stringify(isExpanded ? [cardKey] : []));
                } catch (error) {}
            }
        }

        async function loadManagerSquad(card) {
            const target=card.querySelector('[data-squad-slot]');
            if(!target||target.dataset.loading==='true'||target.dataset.loaded==='true')return;
            if(!squadContext?.enabled){target.textContent='Squad details are not connected for this league yet.';return;}
            const [gameweek,managerId]=card.dataset.cardKey.split(':').map(Number);
            const identity={leagueKey,seasonKey:squadContext.seasonKey,managerId,gameweek};
            const ticket=loadSerial,controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
            target.dataset.loading='true';target.textContent='Loading squad…';
            try {
                const url=new URL(SOURCES[sourceName]);url.searchParams.set('action','getTrackerSquad');
                Object.entries(identity).forEach(([key,value])=>url.searchParams.set(key,value));
                const response=await fetch(url,{signal:controller.signal,cache:'no-store',credentials:'omit'});
                if(!response.ok)throw new Error('Squad unavailable. Close and reopen this card to retry.');
                const squad=window.LeagueSquad.validate(await response.json(),identity);
                if(ticket!==loadSerial||!card.isConnected)return;
                let transferHtml='';
                try {
                    const transferUrl=new URL(SOURCES[sourceName]);transferUrl.searchParams.set('action','getTrackerTransfers');
                    Object.entries({leagueKey,seasonKey:squadContext.seasonKey,managerId,}).forEach(([key,value])=>transferUrl.searchParams.set(key,value));
                    const transferResponse=await fetch(transferUrl,{signal:controller.signal,cache:'no-store',credentials:'omit'});
                    const transferData=await transferResponse.json();
                    if(transferData.ok===true&&Array.isArray(transferData.transfers)){
                        transferHtml=`<div class="squad-transfer-history"><div class="live-squad-heading"><span>Transfers</span><span>${transferData.transfers.length}</span></div>${transferData.transfers.slice(-8).reverse().map(t=>`<div class="transfer-line">GW${Number(t.gameweek)} · ${escapeProfileHtml(t.playerOutId)} → ${escapeProfileHtml(t.playerInId)}${t.wasWildcard?' · Wildcard':''}</div>`).join('')}</div>`;
                    }
                } catch(error) {}
                target.innerHTML=`<div class="live-squad-heading"><span>Squad · GW${gameweek}</span><span>${squad.complete?(squad.finalised?'Final':'Provisional'):'Some player data unavailable'}</span></div>${renderSquadPitch(squad.players,'')}${transferHtml}`;
                target.dataset.loaded='true';
            }catch(error){if(ticket===loadSerial&&card.isConnected)target.textContent=error.name==='AbortError'?'Squad took too long to load. Close and reopen this card to retry.':error.message;}
            finally{clearTimeout(timer);target.dataset.loading='false';}
        }

        function getExpandedManagerCardKeys() {
            try {
                const savedKeys = JSON.parse(sessionStorage.getItem(STORAGE_SCOPE + 'expanded') || '[]');
                return new Set(Array.isArray(savedKeys) && savedKeys.length ? [savedKeys[savedKeys.length - 1]] : []);
            } catch (error) {
                return new Set();
            }
        }

        function handleManagerCardKey(event, card) {
            if(event.target !== card)return;
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                toggleManagerCard(card);
            }
        }

        function escapeProfileHtml(value) {
            return String(value === undefined || value === null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function signedProfileValue(value) {
            const number = Number(value) || 0;
            return number > 0 ? `+${number}` : String(number);
        }

        function formatLiveKickoff(value) {
            if (!value) return '';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            return date.toLocaleString('en-GB', {
                weekday: 'short',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function livePlayerEvents(player) {
            const tags = [];
            const goals = Number(player.goals) || 0;
            const assists = Number(player.assists) || 0;
            const cleanSheets = Number(player.cleanSheets) || 0;
            const saves = Number(player.saves) || 0;
            const yellowCards = Number(player.yellowCards) || 0;
            const redCards = Number(player.redCards) || 0;
            const bonus = Number(player.bonus) || 0;
            const defensiveContributions = Number(player.defensiveContributions) || 0;
            const defensiveTarget = Number(player.defensiveTarget) || 0;

            if (goals) tags.push(`⚽${goals > 1 ? goals : ''}`);
            if (assists) tags.push(`A${assists}`);
            if (cleanSheets) tags.push('CS');
            if (saves) tags.push(`SV ${saves}`);
            if (yellowCards) tags.push('YC');
            if (redCards) tags.push('RC');
            if (bonus) tags.push(`B${bonus}`);
            if (defensiveTarget) tags.push(`DEF ${defensiveContributions}/${defensiveTarget}`);

            return tags.length ? tags.join(' · ') : `${Number(player.minutes) || 0}′`;
        }

        function liveKitUrl(player) {
            const code = Number(player.teamCode) || 0;
            if (!code) return '';
            const goalkeeperSuffix = Number(player.position) === 1 ? '_1' : '';
            return `https://fantasy.premierleague.com/dist/img/shirts/standard/shirt_${code}${goalkeeperSuffix}-110.png`;
        }

        function renderPitchPlayer(player) {
            const encodedPlayer = encodeURIComponent(JSON.stringify(player));
            const statusClass = player.status === 'live' ? 'is-live' : (player.status === 'upcoming' ? 'is-upcoming' : 'is-finished');
            const starClass = player.isStar ? 'is-star' : '';
            const captain = player.isCaptain ? '<span class="pitch-captain">C</span>' : '';
            const points = (Number(player.multiplier) > 0 ? player.points : player.rawPoints) ?? '–';
            const kitUrl = liveKitUrl(player);
            return `<button class="pitch-player ${statusClass} ${starClass}" type="button" data-player="${encodedPlayer}" onclick="openLivePlayerBreakdown(event, this)">
                <span class="pitch-kit-wrap">${captain}${kitUrl ? `<img class="pitch-kit" src="${kitUrl}" alt="" onerror="this.style.display='none'">` : ''}</span>
                <span class="pitch-player-card"><span class="pitch-player-name">${escapeProfileHtml(player.name)}</span><span class="pitch-player-points">${points} pts</span></span>
                <span class="pitch-player-fixture">${escapeProfileHtml(player.opponent || formatLiveKickoff(player.kickoff) || '')}</span>
            </button>`;
        }

        function renderSquadPitch(players, starName) {
            const cleanStarName = String(starName || '').replace(/\s*\(C\)\s*$/, '').trim().toLowerCase();
            const ordered = players.map(player => ({
                ...player,
                isStar: cleanStarName && String(player.name || '').trim().toLowerCase() === cleanStarName
            })).sort((a, b) => Number(a.squadPosition || 99) - Number(b.squadPosition || 99));
            const activeCount = ordered.filter(player => Number(player.multiplier) > 0).length;
            const isBenchBoost = activeCount > 11;
            const starters = ordered.filter(player => isBenchBoost
                ? Number(player.squadPosition || 0) <= 11
                : Number(player.multiplier) > 0);
            const starterIds = new Set(starters.map(player => Number(player.id)));
            const bench = ordered.filter(player => !starterIds.has(Number(player.id)));
            const row = (type, label) => {
                const rowPlayers = starters.filter(player => Number(player.position) === type);
                return rowPlayers.length ? `<div class="pitch-row pitch-row-${type}" aria-label="${label}">${rowPlayers.map(renderPitchPlayer).join('')}</div>` : '';
            };
            return `<div class="squad-pitch">
                <div class="pitch-markings" aria-hidden="true"><span class="pitch-box"></span><span class="pitch-circle"></span></div>
                ${row(1, 'Goalkeepers')}${row(2, 'Defenders')}${row(3, 'Midfielders')}${row(4, 'Forwards')}
                <div class="pitch-bench"><div class="pitch-bench-label">Bench</div><div class="pitch-bench-row">${bench.map(renderPitchPlayer).join('')}</div></div>
            </div>`;
        }

        function openLivePlayerBreakdown(event, button) {
            event.stopPropagation();
            const player = JSON.parse(decodeURIComponent(button.dataset.player || ''));
            const overlay = document.getElementById('livePlayerOverlay');
            const body = document.getElementById('livePlayerOverlayBody');
            if (!overlay || !body) return;
            const rows = (player.breakdown || []).map(row => [row.label, row.value ?? '–', row.points ?? '–']);
            const rawPoints = player.rawPoints ?? '–';
            const multiplier = Number(player.multiplier) || 0;
            const displayPoints = multiplier > 0 ? player.points ?? '–' : rawPoints;
            const kitUrl = liveKitUrl(player);
            body.innerHTML = `<div class="player-sheet-handle"></div><button class="player-sheet-close" type="button" onclick="closeLivePlayerBreakdown(event)" aria-label="Close">×</button>
                <div class="player-sheet-header">
                    <span class="player-sheet-kit">${kitUrl ? `<img src="${kitUrl}" alt="" onerror="this.style.display='none'">` : ''}</span>
                    <span><span class="player-sheet-title">${escapeProfileHtml(player.name)}${player.isCaptain ? ' <em>(C)</em>' : ''}</span><span class="player-sheet-fixture">${escapeProfileHtml(player.opponent || formatLiveKickoff(player.kickoff) || '')}</span></span>
                    <span class="player-sheet-total"><strong>${displayPoints}</strong><span>points</span></span>
                </div>
                <div class="breakdown-title">Points breakdown</div>
                ${rows.length ? '' : '<p>Points breakdown is not available for this player yet.</p>'}
                <div class="breakdown-table">
                    <div class="breakdown-head"><span>Statistic</span><span>Value</span><span>Points</span></div>
                    ${rows.map(([label, value, points]) => `<div class="breakdown-row"><span>${escapeProfileHtml(label)}</span><span>${escapeProfileHtml(value)}</span><strong class="${Number(points) < 0 ? 'negative' : ''}">${Number(points) > 0 ? '+' : ''}${escapeProfileHtml(points)} pts</strong></div>`).join('')}
                </div>
                ${multiplier > 1 ? `<div class="breakdown-multiplier"><span>${player.isCaptain ? 'Captain' : 'Chip'} multiplier ×${multiplier}</span><strong>${displayPoints} pts</strong></div>` : ''}`;
            overlay.classList.add('open');
        }

        function closeLivePlayerBreakdown(event) {
            if (event) event.stopPropagation();
            const overlay = document.getElementById('livePlayerOverlay');
            if (overlay) overlay.classList.remove('open');
        }

        function orderedManagerProfiles(profiles) {
            const items = Array.isArray(profiles) ? profiles.slice() : [];
            if (items.length < 2) return items;

            const storageKey = STORAGE_SCOPE + 'profile-order';
            try {
                const savedOrder = JSON.parse(sessionStorage.getItem(storageKey) || '[]');
                const currentKeys = items.map(item => String(item.managerName || '').toLowerCase());
                const validSavedOrder = savedOrder.length === currentKeys.length &&
                    savedOrder.every(key => currentKeys.includes(key));

                if (validSavedOrder) {
                    return savedOrder.map(key => items.find(item => String(item.managerName || '').toLowerCase() === key));
                }

                for (let index = items.length - 1; index > 0; index--) {
                    const randomIndex = Math.floor(Math.random() * (index + 1));

                }
                sessionStorage.setItem(storageKey, JSON.stringify(items.map(item => String(item.managerName || '').toLowerCase())));

            return items;

        function enableEdgeWrapSwipe(track, getCurrentIndex, getTotalSlides, moveSlide) {
            let touchStartX = null;

            track.addEventListener('touchstart', event => {
                touchStartX = event.touches && event.touches[0] ? event.touches[0].clientX : null;
            }, { passive: true });

            track.addEventListener('touchend', event => {
                if (touchStartX === null || !event.changedTouches || !event.changedTouches[0]) return;
                const distance = event.changedTouches[0].clientX - touchStartX;
                touchStartX = null;
                if (Math.abs(distance) < 45) return;

                const currentIndex = getCurrentIndex();
                const totalSlides = getTotalSlides();
                if (distance > 0 && currentIndex === 0) moveSlide(-1);
                if (distance < 0 && currentIndex === totalSlides - 1) moveSlide(1);
            }, { passive: true });

        function initGwCarousel() {

            // A visual copy of GW1 after the final gameweek lets the carousel
            // continue moving forwards. Once it settles, we silently return to
            // the real GW1 at the identical position in the sequence.
            track.querySelectorAll('.gw-loop-clone').forEach(slide => slide.remove());
            const firstRealSlide = track.querySelector('.carousel-card');
            if (firstRealSlide && totalGwSlides > 1) {
                const firstLoopClone = firstRealSlide.cloneNode(true);

                firstLoopClone.setAttribute('aria-hidden', 'true');
                track.appendChild(firstLoopClone);
            }

            if (!gwCarouselInitialized) {
                currentGwSlideIdx = totalGwSlides - 1;
                gwCarouselInitialized = true;
            } else {
                currentGwSlideIdx = Math.min(currentGwSlideIdx, totalGwSlides - 1);
            }
            scrollGwCarousel(false);
            enableEdgeWrapSwipe(track, () => currentGwSlideIdx, () => totalGwSlides, moveGwSlide);

            track.addEventListener('scroll', () => {
                // Previous/Next already selected the destination slide.
                // Ignore intermediate browser scroll positions so the header
                // does not flash back to the departing gameweek.
                if (gwButtonScrollActive) return;

                const slides = Array.from(track.querySelectorAll('.carousel-card:not(.gw-loop-clone)'));
                if (slides.length === 0) return;

                const firstOffset = slides[0].offsetLeft;
                let index = 0;
                let closestDistance = Infinity;

                slides.forEach((slide, slideIndex) => {
                    const slidePosition = slide.offsetLeft - firstOffset;
                    const distance = Math.abs(track.scrollLeft - slidePosition);
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        index = slideIndex;
                    }
                });

                if (index !== currentGwSlideIdx && index >= 0 && index < totalGwSlides) {
                    currentGwSlideIdx = index;
                    updateGwCarouselHeader();
                }
            });

        function formatDeadlineBadge(deadlineValue) {

            const weekday = deadline.toLocaleDateString(undefined, { weekday: 'short' }).toUpperCase();
            const day = deadline.toLocaleDateString(undefined, { day: 'numeric' });
            const month = deadline.toLocaleDateString(undefined, { month: 'short' }).toUpperCase();
            const time = deadline.toLocaleTimeString(undefined, {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            return `DEADLINE · ${weekday} ${day} ${month} · ${time}`;
        }

            if (prevBtn) prevBtn.disabled = totalGwSlides < 2;
            if (nextBtn) nextBtn.disabled = totalGwSlides < 2;

            if (titleEl && gwDataStore[currentGwSlideIdx]) {
                const gwInfo = gwDataStore[currentGwSlideIdx];
                const gwNum = gwInfo.gameweek !== undefined ? gwInfo.gameweek : (gwInfo.gw !== undefined ? gwInfo.gw : (currentGwSlideIdx + 1));
                const badge = gwInfo.isUpcoming
                    ? `<span class="badge-deadline">${formatDeadlineBadge(gwInfo.deadline)}</span>`
                    : (gwInfo.isLive
                        ? `<span class="badge-live">LIVE</span>`
                        : `<span class="badge-final">${gwInfo.finalised ? 'FINAL' : 'PROVISIONAL'}</span>`);
                titleEl.textContent = `GW ${gwNum}`;
                if (statusEl) statusEl.innerHTML = badge;
            }

            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentGwSlideIdx);
                dot.classList.toggle('is-hidden', Math.abs(index - currentGwSlideIdx) > 3);
            });
        }

        function scrollGwCarousel(smooth = true, fromButton = false) {
            const track = document.getElementById('gw-carousel-track');
            const slide = document.getElementById(`gw-slide-${currentGwSlideIdx}`);
            if (track && slide) {
                const firstSlide = track.querySelector('.carousel-card');
                const firstOffset = firstSlide ? firstSlide.offsetLeft : 0;

                if (fromButton) {
                    gwButtonScrollActive = true;
                    gwButtonScrollToken += 1;
                    if (gwButtonScrollTimer) clearTimeout(gwButtonScrollTimer);
                }

                track.scrollTo({
                    left: slide.offsetLeft - firstOffset,
                    behavior: smooth ? 'smooth' : 'auto'
                });

                if (fromButton) {
                    const activeScrollToken = gwButtonScrollToken;
                    const releaseButtonScroll = () => {
                        if (activeScrollToken !== gwButtonScrollToken) return;
                        if (!gwButtonScrollActive) return;

                        gwButtonScrollActive = false;
                        if (gwButtonScrollTimer) {
                            clearTimeout(gwButtonScrollTimer);
                            gwButtonScrollTimer = null;
                        }

                        // Keep the departing GW label in place while the cards
                        // move, then update the title, badge, arrows and dots
                        // once the destination slide has settled.
                        updateGwCarouselHeader();
                    };

                    if ('onscrollend' in track) {
                        track.addEventListener('scrollend', releaseButtonScroll, { once: true });
                    }

                    // Fallback for browsers that do not support scrollend.
                    gwButtonScrollTimer = setTimeout(releaseButtonScroll, smooth ? 700 : 50);
                }
            }

            if (!fromButton) {
                updateGwCarouselHeader();
            }
        }

        function moveGwSlide(direction) {
            if (totalGwSlides < 1) return;

            if (direction > 0 && currentGwSlideIdx === totalGwSlides - 1 && totalGwSlides > 1) {
                const track = document.getElementById('gw-carousel-track');
                const loopClone = document.getElementById('gw-slide-loop-first');
                const firstRealSlide = document.getElementById('gw-slide-0');
                if (track && loopClone && firstRealSlide) {
                    currentGwSlideIdx = 0;
                    gwButtonScrollActive = true;
                    gwButtonScrollToken += 1;
                    const activeScrollToken = gwButtonScrollToken;
                    if (gwButtonScrollTimer) clearTimeout(gwButtonScrollTimer);

                    const firstOffset = firstRealSlide.offsetLeft;
                    track.scrollTo({
                        left: loopClone.offsetLeft - firstOffset,
                        behavior: 'smooth'
                    });

                    const finishLoop = () => {
                        if (activeScrollToken !== gwButtonScrollToken) return;
                        if (!gwButtonScrollActive) return;
                        track.scrollTo({ left: 0, behavior: 'auto' });
                        gwButtonScrollActive = false;
                        gwButtonScrollTimer = null;
                        updateGwCarouselHeader();
                    };

                    if ('onscrollend' in track) {
                        track.addEventListener('scrollend', finishLoop, { once: true });
                    }
                    gwButtonScrollTimer = setTimeout(finishLoop, 700);
                    return;
                }
            }

            if (direction < 0 && currentGwSlideIdx === 0 && totalGwSlides > 1) {
                const track = document.getElementById('gw-carousel-track');
                const loopClone = document.getElementById('gw-slide-loop-first');
                const firstRealSlide = document.getElementById('gw-slide-0');
                const lastRealSlide = document.getElementById(`gw-slide-${totalGwSlides - 1}`);
                if (track && loopClone && firstRealSlide && lastRealSlide) {
                    currentGwSlideIdx = totalGwSlides - 1;
                    gwButtonScrollActive = true;
                    gwButtonScrollToken += 1;
                    const activeScrollToken = gwButtonScrollToken;
                    if (gwButtonScrollTimer) clearTimeout(gwButtonScrollTimer);

                    const firstOffset = firstRealSlide.offsetLeft;
                    // Jump to the identical GW1 copy, then travel one card
                    // backwards into the final real gameweek.
                    track.scrollTo({
                        left: loopClone.offsetLeft - firstOffset,
                        behavior: 'auto'
                    });

                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        track.scrollTo({
                            left: lastRealSlide.offsetLeft - firstOffset,
                            behavior: 'smooth'
                        });
                    }));

                    const finishReverseLoop = () => {
                        if (activeScrollToken !== gwButtonScrollToken) return;
                        if (!gwButtonScrollActive) return;
                        gwButtonScrollActive = false;
                        gwButtonScrollTimer = null;
                        updateGwCarouselHeader();
                    };

                    if ('onscrollend' in track) {
                        track.addEventListener('scrollend', finishReverseLoop, { once: true });
                    }
                    gwButtonScrollTimer = setTimeout(finishReverseLoop, 700);
                    return;
                }
            }

            currentGwSlideIdx = (currentGwSlideIdx + direction + totalGwSlides) % totalGwSlides;
            scrollGwCarousel(true, true);
        }

        function goToGwSlide(index) {
            if (index >= 0 && index < totalGwSlides) {
                currentGwSlideIdx = index;
                scrollGwCarousel(true, true);
            }
        }

        function initPeriodCarousel() {
            const track = document.getElementById('period-carousel');
            if (!track) return;

            track.querySelectorAll('.period-loop-clone').forEach(slide => slide.remove());
            const firstRealSlide = track.querySelector('.carousel-card');
            if (firstRealSlide && totalPeriodSlides > 1) {
                const loopClone = firstRealSlide.cloneNode(true);
                loopClone.id = 'period-slide-loop-first';
                loopClone.classList.add('period-loop-clone');
                loopClone.setAttribute('aria-hidden', 'true');
                track.appendChild(loopClone);
            }

            if (!periodCarouselInitialized) {
                const currentGw = gwDataStore[gwDataStore.length - 1]?.gameweek || 1;
                const periods = Array.from(track.querySelectorAll('.carousel-card:not(.period-loop-clone)'));
                const currentIndex = periods.findIndex(slide => Number(slide.dataset.endGw) >= currentGw);
                currentPeriodSlideIdx = currentIndex < 0 ? totalPeriodSlides - 1 : currentIndex;
                periodCarouselInitialized = true;
            } else {
                currentPeriodSlideIdx = Math.min(currentPeriodSlideIdx, totalPeriodSlides - 1);
            }
            scrollPeriodCarousel(false);
            enableEdgeWrapSwipe(track, () => currentPeriodSlideIdx, () => totalPeriodSlides, movePeriodSlide);

            track.addEventListener('scroll', () => {
                if (periodLoopActive) return;
                const slides = Array.from(track.querySelectorAll('.carousel-card:not(.period-loop-clone)'));
                if (slides.length === 0) return;
                const firstOffset = slides[0].offsetLeft;
                let index = 0;
                let closestDistance = Infinity;

                slides.forEach((slide, slideIndex) => {
                    const distance = Math.abs(track.scrollLeft - (slide.offsetLeft - firstOffset));
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        index = slideIndex;
                    }
                });

                if (index !== currentPeriodSlideIdx) {
                    currentPeriodSlideIdx = index;
                    updatePeriodCarouselHeader();
                }
            });
        }

        function updatePeriodCarouselHeader() {
            const prevBtn = document.getElementById('prevPeriodBtn');
            const nextBtn = document.getElementById('nextPeriodBtn');
            const titleEl = document.getElementById('periodSlideTitle');
            const slide = document.getElementById(`period-slide-${currentPeriodSlideIdx}`);
            const dots = document.querySelectorAll('#period-progress .gw-progress-dot');

            if (prevBtn) prevBtn.disabled = totalPeriodSlides < 2;
            if (nextBtn) nextBtn.disabled = totalPeriodSlides < 2;
            if (titleEl && slide) titleEl.textContent = slide.dataset.periodTitle || `Period ${currentPeriodSlideIdx + 1}`;

            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentPeriodSlideIdx);
                dot.classList.toggle('is-hidden', Math.abs(index - currentPeriodSlideIdx) > 3);
            });
        }

        function scrollPeriodCarousel(smooth = true) {
            const track = document.getElementById('period-carousel');
            const slide = document.getElementById(`period-slide-${currentPeriodSlideIdx}`);
            if (track && slide) {
                const firstSlide = track.querySelector('.carousel-card');
                const firstOffset = firstSlide ? firstSlide.offsetLeft : 0;
                track.scrollTo({
                    left: slide.offsetLeft - firstOffset,
                    behavior: smooth ? 'smooth' : 'auto'
                });
            }
            updatePeriodCarouselHeader();
        }

        function movePeriodSlide(direction) {
            if (totalPeriodSlides < 1) return;

            if (direction > 0 && currentPeriodSlideIdx === totalPeriodSlides - 1 && totalPeriodSlides > 1) {
                const track = document.getElementById('period-carousel');
                const clone = document.getElementById('period-slide-loop-first');
                const first = document.getElementById('period-slide-0');
                if (track && clone && first) {
                    currentPeriodSlideIdx = 0;
                    periodLoopActive = true;
                    const firstOffset = first.offsetLeft;
                    track.scrollTo({ left: clone.offsetLeft - firstOffset, behavior: 'smooth' });
                    setTimeout(() => {
                        track.scrollTo({ left: 0, behavior: 'auto' });
                        periodLoopActive = false;
                        updatePeriodCarouselHeader();
                    }, 700);
                    return;
                }
            }

            if (direction < 0 && currentPeriodSlideIdx === 0 && totalPeriodSlides > 1) {
                const track = document.getElementById('period-carousel');
                const clone = document.getElementById('period-slide-loop-first');
                const first = document.getElementById('period-slide-0');
                const last = document.getElementById(`period-slide-${totalPeriodSlides - 1}`);
                if (track && clone && first && last) {
                    currentPeriodSlideIdx = totalPeriodSlides - 1;
                    periodLoopActive = true;
                    const firstOffset = first.offsetLeft;
                    track.scrollTo({ left: clone.offsetLeft - firstOffset, behavior: 'auto' });
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        track.scrollTo({ left: last.offsetLeft - firstOffset, behavior: 'smooth' });
                    }));
                    setTimeout(() => {
                        periodLoopActive = false;
                        updatePeriodCarouselHeader();
                    }, 700);
                    return;
                }
            }

            currentPeriodSlideIdx = (currentPeriodSlideIdx + direction + totalPeriodSlides) % totalPeriodSlides;
            scrollPeriodCarousel(true);
        }

        function goToPeriodSlide(index) {
            if (index >= 0 && index < totalPeriodSlides) {
                currentPeriodSlideIdx = index;
                scrollPeriodCarousel(true);
            }
        }

        function initProfileCarousel() {
            const track = document.getElementById('profile-carousel-track');
            if (!track) return;

            track.querySelectorAll('.profile-loop-clone').forEach(slide => slide.remove());
            const firstRealSlide = track.querySelector('.profile-slide');
            if (firstRealSlide && totalProfileSlides > 1) {
                const loopClone = firstRealSlide.cloneNode(true);
                loopClone.id = 'profile-slide-loop-first';
                loopClone.classList.add('profile-loop-clone');
                loopClone.setAttribute('aria-hidden', 'true');
                track.appendChild(loopClone);
            }

            if (!profileCarouselInitialized) {
                currentProfileSlideIdx = 0;
                profileCarouselInitialized = true;
            } else {
                currentProfileSlideIdx = Math.min(currentProfileSlideIdx, totalProfileSlides - 1);
            }
            scrollProfileCarousel(false);
            enableEdgeWrapSwipe(track, () => currentProfileSlideIdx, () => totalProfileSlides, moveProfileSlide);

            track.addEventListener('scroll', () => {
                if (profileLoopActive) return;
                const slides = Array.from(track.querySelectorAll('.profile-slide:not(.profile-loop-clone)'));
                if (slides.length === 0) return;
                const firstOffset = slides[0].offsetLeft;
                let closestIndex = 0;
                let closestDistance = Infinity;

                slides.forEach((slide, index) => {
                    const distance = Math.abs(track.scrollLeft - (slide.offsetLeft - firstOffset));
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        closestIndex = index;
                    }
                });

                if (closestIndex !== currentProfileSlideIdx) {
                    currentProfileSlideIdx = closestIndex;
                    updateProfileCarouselHeader();
                }
            });
        }

        function updateProfileCarouselHeader() {
            const prevBtn = document.getElementById('prevProfileBtn');
            const nextBtn = document.getElementById('nextProfileBtn');
            const titleEl = document.getElementById('profileSlideTitle');
            const slide = document.getElementById(`profile-slide-${currentProfileSlideIdx}`);
            const dots = document.querySelectorAll('#profile-progress .gw-progress-dot');

            if (prevBtn) prevBtn.disabled = totalProfileSlides < 2;
            if (nextBtn) nextBtn.disabled = totalProfileSlides < 2;
            if (titleEl) titleEl.textContent = 'Season Records';
            dots.forEach((dot, index) => dot.classList.toggle('active', index === currentProfileSlideIdx));
        }

        function scrollProfileCarousel(smooth = true) {
            const track = document.getElementById('profile-carousel-track');
            const slide = document.getElementById(`profile-slide-${currentProfileSlideIdx}`);
            if (track && slide) {
                const firstSlide = track.querySelector('.profile-slide');
                const firstOffset = firstSlide ? firstSlide.offsetLeft : 0;
                track.scrollTo({
                    left: slide.offsetLeft - firstOffset,
                    behavior: smooth ? 'smooth' : 'auto'
                });
            }
            updateProfileCarouselHeader();
        }

        function moveProfileSlide(direction) {
            if (totalProfileSlides < 1) return;

            if (direction > 0 && currentProfileSlideIdx === totalProfileSlides - 1 && totalProfileSlides > 1) {
                const track = document.getElementById('profile-carousel-track');
                const clone = document.getElementById('profile-slide-loop-first');
                const first = document.getElementById('profile-slide-0');
                if (track && clone && first) {
                    currentProfileSlideIdx = 0;
                    profileLoopActive = true;
                    const firstOffset = first.offsetLeft;
                    track.scrollTo({ left: clone.offsetLeft - firstOffset, behavior: 'smooth' });
                    setTimeout(() => {
                        track.scrollTo({ left: 0, behavior: 'auto' });
                        profileLoopActive = false;
                        updateProfileCarouselHeader();
                    }, 700);
                    return;
                }
            }

            if (direction < 0 && currentProfileSlideIdx === 0 && totalProfileSlides > 1) {
                const track = document.getElementById('profile-carousel-track');
                const clone = document.getElementById('profile-slide-loop-first');
                const first = document.getElementById('profile-slide-0');
                const last = document.getElementById(`profile-slide-${totalProfileSlides - 1}`);
                if (track && clone && first && last) {
                    currentProfileSlideIdx = totalProfileSlides - 1;
                    profileLoopActive = true;
                    const firstOffset = first.offsetLeft;
                    track.scrollTo({ left: clone.offsetLeft - firstOffset, behavior: 'auto' });
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        track.scrollTo({ left: last.offsetLeft - firstOffset, behavior: 'smooth' });
                    }));
                    setTimeout(() => {
                        profileLoopActive = false;
                        updateProfileCarouselHeader();
                    }, 700);
                    return;
                }
            }

            currentProfileSlideIdx = (currentProfileSlideIdx + direction + totalProfileSlides) % totalProfileSlides;
            scrollProfileCarousel(true);
        }

        function goToProfileSlide(index) {
            if (index >= 0 && index < totalProfileSlides) {
                currentProfileSlideIdx = index;
                scrollProfileCarousel(true);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadTrackerData();
            window.setInterval(() => {
                if (!document.hidden) loadTrackerData();
            }, 120000);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) loadTrackerData();
            });
        });
    </script>

</body>
